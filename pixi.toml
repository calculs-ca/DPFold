
[workspace]
name = "DPFold"
version = "0.1"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.*"
colabfold = "1.5.5.*"
setuptools = "*"
jax = "==0.4.23"
jaxlib = "==0.4.23"
chex = "==0.1.86"
openmm = "==8.0.0"
ambertools = "22.*"
dm-haiku = "==0.0.10"
pandas = "==1.3.4"

[system-requirements]
cuda = "12.2"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src:$PIXI_PROJECT_ROOT/WebGasket:$PIXI_PROJECT_ROOT/WebGasket/DryPipe"
